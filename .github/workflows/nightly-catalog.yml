name: Nightly catalog audit

on:
  schedule:
    - cron: "17 3 * * *"
      timezone: "Europe/Stockholm"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-catalog
  cancel-in-progress: false

jobs:
  audit:
    name: Refresh generators and audit catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out default branch
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh weather snapshot
        run: npm run weather:update

      - name: Generate schedule and Text-TV data
        run: npm run data:build

      - name: Audit sources, rights and generated data
        if: always()
        run: npm run catalog:audit

      - name: Save traceable report and generated data
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: catalog-audit-${{ github.sha }}
          path: |
            artifacts/catalog-audit
            public/data
          if-no-files-found: warn
          retention-days: 30

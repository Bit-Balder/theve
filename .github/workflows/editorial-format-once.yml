name: Temporary editorial format

on:
  push:
    branches:
      - feat/programschema-editorial-review

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/programschema-editorial-review
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Format the new editorial files
        run: |
          npm ci
          npx biome check --write scripts/apply-editorial-review.mjs \
            scripts/lib/editorial-review.mjs \
            tests/editorial-review.test.mjs \
            src/programschema/main.ts \
            e2e/programschema.spec.ts \
            vite.config.ts

      - name: Push formatting changes only to the feature branch
        shell: bash
        run: |
          git add scripts/apply-editorial-review.mjs \
            scripts/lib/editorial-review.mjs \
            tests/editorial-review.test.mjs \
            src/programschema/main.ts \
            e2e/programschema.spec.ts \
            vite.config.ts
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply Biome to editorial dashboard"
          git push origin HEAD:feat/programschema-editorial-review

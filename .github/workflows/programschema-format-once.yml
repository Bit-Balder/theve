name: Temporary Programschema formatter
on:
  push:
    branches:
      - feat/programschema-private-rights-and-dismissal
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/programschema-private-rights-and-dismissal
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Format modified review files
        run: |
          npm ci
          npx biome check --write scripts/lib/editorial-review.mjs \
            scripts/apply-editorial-review.mjs \
            scripts/lib/archive-discovery.mjs \
            scripts/discover-archive.mjs \
            src/programschema/main.ts \
            src/programschema/style.css \
            tests/editorial-review.test.mjs \
            tests/archive-discovery.test.mjs \
            e2e/programschema.spec.ts
      - name: Push formatting only to feature branch
        shell: bash
        run: |
          git add scripts/lib/editorial-review.mjs \
            scripts/apply-editorial-review.mjs \
            scripts/lib/archive-discovery.mjs \
            scripts/discover-archive.mjs \
            src/programschema/main.ts \
            src/programschema/style.css \
            tests/editorial-review.test.mjs \
            tests/archive-discovery.test.mjs \
            e2e/programschema.spec.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format private rights and dismissal changes"
          git push origin HEAD:feat/programschema-private-rights-and-dismissal
